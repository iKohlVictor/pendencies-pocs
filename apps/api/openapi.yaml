openapi: 3.0.3
info:
  title: Pendencies API
  version: 0.0.1
  description: |
    Demo backend that uses the machine-flow lib to drive two workflows: an event's release
    and the review of each pendency inside it.

    Events and pendencies are typed. An event type sets the event's name and the pendencies created
    with it; a pendency type sets the pendency's name and the workflow it follows. See `/event-types`
    and `/pendency-types`.

    Workflows are versioned JSON definitions (`/flows`). They are edited as a draft and published as
    an immutable version. A pendency records the flow and version it was opened on (`flow`,
    `flowVersion`) and finishes on it, whatever gets published later. A pendency type follows the
    latest published version of its flow, or a pinned one (`PUT /pendency-types/{id}/flow`).
    States are free; actions, guards and roles come from a fixed catalog (`/flow-catalog`).

    An event can only be scheduled once all its pendencies are resolved (a guard on the release
    machine), and it is completed when it is `scheduled` AND its pendencies are still all resolved.

    Identity is demo-only: the caller sends only `x-user-id` with the id of a user created through
    `POST /users`. The roles the workflows check (`branch`, `documentation_analysis`, `payment_scheduling`)
    come from that user's profile. An unknown id answers 401.
servers:
  - url: http://localhost:3000
tags:
  - name: Catalog
  - name: Flows
  - name: Events
  - name: Event release
  - name: Pendencies
  - name: Branch actions
  - name: Review actions
  - name: Notifications
  - name: Users

paths:
  /event-types:
    get:
      tags: [Catalog]
      operationId: listEventTypes
      summary: Event types, with the pendencies each one creates
      responses:
        '200':
          description: The catalog of event types
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { $ref: '#/components/schemas/EventType' }
                    name: { type: string }
                    pendencyTypes:
                      type: array
                      items: { $ref: '#/components/schemas/PendencyType' }

  /pendency-types:
    get:
      tags: [Catalog]
      operationId: listPendencyTypes
      summary: Pendency types, with the flow and version new pendencies start on
      responses:
        '200':
          description: The catalog of pendency types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendencyTypeView' }

  /pendency-types/{id}/flow:
    put:
      tags: [Catalog]
      operationId: bindPendencyTypeFlow
      summary: Points a type at a flow, following its latest version (version null) or a pinned one
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/PendencyType' } }
        - $ref: '#/components/parameters/UserIdDocumentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flowId]
              properties:
                flowId: { type: string, example: standard }
                version: { type: integer, nullable: true, description: null = always the latest published }
      responses:
        '200':
          description: The type with its new binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendencyTypeView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: The flow has no published version yet }

  /flow-catalog:
    get:
      tags: [Flows]
      operationId: getFlowCatalog
      summary: The blocks a flow can use (actions, guards, roles, effects)
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowCatalog' }

  /flows:
    get:
      tags: [Flows]
      operationId: listFlows
      summary: Every flow with its published versions
      responses:
        '200':
          description: Flow summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FlowSummary' }
    post:
      tags: [Flows]
      operationId: createFlow
      summary: Creates a flow with a draft (a starter one when no definition is sent)
      parameters:
        - $ref: '#/components/parameters/UserIdDocumentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, example: quick }
                name: { type: string }
                definition: { $ref: '#/components/schemas/FlowDefinition' }
      responses:
        '201': { $ref: '#/components/responses/Flow' }
        '409': { description: A flow with this id already exists }
        '422': { $ref: '#/components/responses/MissingField' }

  /flows/validate:
    post:
      tags: [Flows]
      operationId: validateFlow
      summary: Checks a definition without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: { $ref: '#/components/schemas/FlowDefinition' }
      responses:
        '200':
          description: Every issue found (empty when valid)
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  issues:
                    type: array
                    items: { $ref: '#/components/schemas/FlowIssue' }

  /flows/{id}:
    get:
      tags: [Flows]
      operationId: getFlow
      summary: A flow with its draft and every published version
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200': { $ref: '#/components/responses/Flow' }
        '404': { $ref: '#/components/responses/NotFound' }

  /flows/{id}/draft:
    put:
      tags: [Flows]
      operationId: saveFlowDraft
      summary: Saves the draft. Not validated until published.
      parameters:
        - $ref: '#/components/parameters/FlowId'
        - $ref: '#/components/parameters/UserIdDocumentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition: { $ref: '#/components/schemas/FlowDefinition' }
                name: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Flow' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Flows]
      operationId: discardFlowDraft
      summary: Throws the draft away
      parameters:
        - $ref: '#/components/parameters/FlowId'
        - $ref: '#/components/parameters/UserIdDocumentation'
      responses:
        '200': { $ref: '#/components/responses/Flow' }

  /flows/{id}/publish:
    post:
      tags: [Flows]
      operationId: publishFlow
      summary: Validates the draft and freezes it as the next version
      description: Pendencies already running keep their version. New ones follow the type's binding.
      parameters:
        - $ref: '#/components/parameters/FlowId'
        - $ref: '#/components/parameters/UserIdDocumentation'
      responses:
        '200':
          description: The new version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: No draft to publish }
        '422':
          description: The draft is invalid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      issues:
                        type: array
                        items: { $ref: '#/components/schemas/FlowIssue' }

  /flows/{id}/versions/{version}:
    get:
      tags: [Flows]
      operationId: getFlowVersion
      summary: One published (immutable) version
      parameters:
        - $ref: '#/components/parameters/FlowId'
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowVersion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events:
    post:
      tags: [Events]
      operationId: openEvent
      summary: Open an event of a type (born not scheduled, with the type's pendencies already created)
      parameters:
        - $ref: '#/components/parameters/UserIdScheduling'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: '#/components/schemas/EventType' }
                name:
                  type: string
                  description: Optional. Defaults to the type's name.
                paymentDueAt:
                  type: string
                  format: date-time
                  description: >-
                    Optional. The order's payment due date. When set, every payment pendency of
                    the event (predefined or added later) follows it, and any `paymentDueAt` sent
                    when adding a pendency is ignored.
            example: { type: resolve_documentation }
      responses:
        '201': { $ref: '#/components/responses/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidValue' }
    get:
      tags: [Events]
      operationId: listEvents
      summary: List all events
      responses:
        '200':
          description: All events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }

  /events/{id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get one event with release status, pendencies status and completion
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200': { $ref: '#/components/responses/Event' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/pendencies:
    post:
      tags: [Events]
      operationId: openPendencyInEvent
      summary: Add one more pendency to the event by hand (born pending with the branch)
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/UserIdDocumentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: '#/components/schemas/PendencyType' }
                title:
                  type: string
                  description: Optional. Defaults to the type's name.
                paymentDueAt:
                  type: string
                  format: date-time
                  description: >-
                    Required for `payment` when the event has no `paymentDueAt` (the event's
                    date wins when it has one), ignored for other types. Due in 48h or less (or overdue) when
                    documentation analysis approves => payment scheduling must approve too;
                    otherwise documentation analysis alone completes it.
            example: { type: missing_invoice }
      responses:
        '201': { $ref: '#/components/responses/Pendency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidValue' }
    get:
      tags: [Events]
      operationId: listEventPendencies
      summary: List the pendencies of the event
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Pendencies of the event
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pendency' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/actions:
    get:
      tags: [Event release]
      operationId: listEventActions
      summary: Release actions the caller may take right now
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/UserIdScheduling'
      responses:
        '200':
          description: Available release actions for this actor
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items: { $ref: '#/components/schemas/ReleaseAction' }
              example: { actions: [START_ANALYSIS] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/start-analysis:
    post:
      tags: [Event release]
      operationId: startEventAnalysis
      summary: Payment scheduling starts the analysis (not_scheduled -> in_analysis)
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/UserIdScheduling'
      responses:
        '200': { $ref: '#/components/responses/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ActionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionDenied' }

  /events/{id}/return:
    post:
      tags: [Event release]
      operationId: returnEvent
      summary: Payment scheduling returns it (in_analysis -> not_scheduled)
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/UserIdScheduling'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
            example: { reason: Aguardando arquivo do banco }
      responses:
        '200': { $ref: '#/components/responses/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ActionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionDenied' }

  /events/{id}/schedule:
    post:
      tags: [Event release]
      operationId: scheduleEvent
      summary: Payment scheduling schedules it (in_analysis -> scheduled)
      description: |
        Guarded: refused with 422 `GUARD_FAILED` (`pendencies-resolved`) while any pendency of the event is open.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/UserIdScheduling'
      responses:
        '200': { $ref: '#/components/responses/Event' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ActionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionDenied' }
        '422': { $ref: '#/components/responses/GuardFailed' }

  /pendencies:
    get:
      tags: [Pendencies]
      operationId: listPendencies
      summary: List all pendencies
      responses:
        '200':
          description: All pendencies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pendency' }

  /pendencies/{id}:
    get:
      tags: [Pendencies]
      operationId: getPendency
      summary: Get one pendency with its full history
      parameters:
        - $ref: '#/components/parameters/PendencyId'
      responses:
        '200': { $ref: '#/components/responses/Pendency' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pendencies/{id}/actions:
    get:
      tags: [Pendencies]
      operationId: listAvailableActions
      summary: Actions the caller may take right now
      parameters:
        - $ref: '#/components/parameters/PendencyId'
        - $ref: '#/components/parameters/UserIdBranch'
      responses:
        '200':
          description: Available actions for this actor in the current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items: { $ref: '#/components/schemas/Action' }
              example: { actions: [ATTACH_DOCUMENT, RESOLVE_WITH_COMMENT, REQUEST_EXCEPTION] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pendencies/{id}/attach-document:
    post:
      tags: [Branch actions]
      operationId: attachDocument
      summary: Branch attaches a document (goes to documentation review)
      parameters:
        - $ref: '#/components/parameters/PendencyId'
        - $ref: '#/components/parameters/UserIdBranch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId]
              properties:
                documentId: { type: string }
            example: { documentId: DOC-1 }
      responses:
        '200': { $ref: '#/components/responses/Pendency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ActionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionDenied' }
        '422': { $ref: '#/components/responses/MissingField' }

  /pendencies/{id}/resolve:
    post:
      tags: [Branch actions]
      operationId: resolveWithComment
      summary: Branch resolves with a comment (goes to documentation review)
      parameters:
        - $ref: '#/components/parameters/PendencyId'
        - $ref: '#/components/parameters/UserIdBranch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string }
            example: { comment: Já regularizado com o fornecedor }
      responses:
        '200': { $ref: '#/components/responses/Pendency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ActionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionDenied' }
        '422': { $ref: '#/components/responses/MissingField' }

  /pendencies/{id}/request-exception:
    post:
      tags: [Branch actions]
      operationId: requestException
      summary: Branch requests an exception (goes to payment scheduling first)
      description: Only for pendencies whose type follows the `standard` flow. On a `direct` flow it answers 409 `INVALID_EVENT`.
      parameters:
        - $ref: '#/components/parameters/PendencyId'
        - $ref: '#/components/parameters/UserIdBranch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justification]
              properties:
                justification: { type: string }
            example: { justification: Fornecedor só emite a nota dia 20 }
      responses:
        '200': { $ref: '#/components/responses/Pendency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ActionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionDenied' }
        '422': { $ref: '#/components/responses/MissingField' }

  /pendencies/{id}/approve:
    post:
      tags: [Review actions]
      operationId: approve
      summary: Current reviewer approves
      description: |
        Who may approve depends on the state: `payment_scheduling` while in
        `in_payment_scheduling_review`, `documentation_analysis` while in `in_documentation_review`.
      parameters:
        - $ref: '#/components/parameters/PendencyId'
        - $ref: '#/components/parameters/UserIdDocumentation'
      responses:
        '200': { $ref: '#/components/responses/Pendency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ActionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionDenied' }

  /pendencies/{id}/reject:
    post:
      tags: [Review actions]
      operationId: reject
      summary: Current reviewer rejects with a reason (goes back to the branch)
      parameters:
        - $ref: '#/components/parameters/PendencyId'
        - $ref: '#/components/parameters/UserIdDocumentation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
            example: { reason: Falta o comprovante }
      responses:
        '200': { $ref: '#/components/responses/Pendency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ActionDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionDenied' }
        '422': { $ref: '#/components/responses/MissingField' }

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Notifications the workflow would have sent
      parameters:
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Notifications, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }

  /profiles:
    get:
      tags: [Users]
      operationId: listProfiles
      summary: Profiles. Starts with PRF-1 Filial, PRF-2 Análise de documentação, PRF-3 Programação de pagamento
      responses:
        '200':
          description: All profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Profile' }
    post:
      tags: [Users]
      operationId: createProfile
      summary: Creates a profile with one or more workflow roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, roles]
              properties:
                name: { type: string, example: Supervisor }
                roles:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Role' }
                  example: [documentation_analysis, payment_scheduling]
      responses:
        '201':
          description: The created profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '422': { $ref: '#/components/responses/MissingField' }

  /profiles/{id}:
    get:
      tags: [Users]
      operationId: getProfile
      summary: One profile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: PRF-1 }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Users, with their profile resolved
      parameters:
        - { name: profileId, in: query, required: false, schema: { type: string }, example: PRF-1 }
      responses:
        '200':
          description: All users (or those of one profile)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Creates a user assigned to a profile. Its id is what goes in `x-user-id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, profileId]
              properties:
                name: { type: string, example: Ana }
                profileId: { type: string, example: PRF-1 }
      responses:
        '201':
          description: The created user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/MissingField' }

  /users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: One user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: USR-1 }
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/profile:
    put:
      tags: [Users]
      operationId: assignProfile
      summary: Moves the user to another profile; their roles change with it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: USR-1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string, example: PRF-2 }
      responses:
        '200':
          description: The user with the new profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/MissingField' }

components:
  parameters:
    FlowId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: standard
    EventId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: EVT-1
    UserIdScheduling:
      name: x-user-id
      in: header
      required: true
      schema: { type: string }
      example: USR-2
    PendencyId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: PEND-1
    UserIdBranch:
      name: x-user-id
      in: header
      required: true
      schema: { type: string }
      example: USR-1
    UserIdDocumentation:
      name: x-user-id
      in: header
      required: true
      schema: { type: string }
      example: USR-3

  responses:
    Event:
      description: The event after the operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Event' }
    Pendency:
      description: The pendency after the operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Pendency' }
    Flow:
      description: The flow
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Flow' }
    Unauthorized:
      description: Missing x-user-id header, or no user with that id
    NotFound:
      description: Event, pendency, flow, flow version, user or profile not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MissingField:
      description: A required field is missing
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 422
            error: MissingFieldError
            message: Field "reason" is required
            field: reason
    InvalidValue:
      description: Unknown or missing type
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 422
            error: InvalidValueError
            message: 'Field "type" must be one of: resolve_documentation, supplier_onboarding, ad_hoc'
            field: type
            allowed: [resolve_documentation, supplier_onboarding, ad_hoc]
    GuardFailed:
      description: The state machine refused the action because the data does not allow it (`GUARD_FAILED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 422
            error: ActionDeniedError
            message: 'Action denied on Event EVT-1: GUARD_FAILED'
            reason:
              code: GUARD_FAILED
              state: in_analysis
              event: SCHEDULE
              failed: [pendencies-resolved]
    ActionDenied:
      description: |
        The state machine refused the action.
        403 = `FORBIDDEN` (wrong role for this step).
        409 = `INVALID_EVENT` (action does not exist in the current state) or `FINAL_STATE` (already completed).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            statusCode: 403
            error: ActionDeniedError
            message: 'Action denied on Pendency PEND-1: FORBIDDEN'
            reason:
              code: FORBIDDEN
              state: in_payment_scheduling_review
              event: APPROVE
              failed: ['role:payment_scheduling']

  schemas:
    Profile:
      type: object
      properties:
        id: { type: string, example: PRF-1 }
        name: { type: string, example: Filial }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    User:
      type: object
      properties:
        id: { type: string, example: USR-1 }
        name: { type: string, example: Ana }
        profile: { $ref: '#/components/schemas/Profile' }
    EventType:
      type: string
      enum: [resolve_documentation, supplier_onboarding, ad_hoc]
    PendencyType:
      type: string
      enum: [missing_invoice, unsigned_contract, registration_update, payment]
    PendencyFlow:
      type: string
      description: Id of a flow (see /flows). Seeded with standard, direct and payment.
      example: standard
    Role:
      type: string
      enum: [branch, documentation_analysis, payment_scheduling]
    Status:
      type: string
      description: A state id of the pendency's flow version. Free; the seeded flows use these.
      example: pending_branch
    PendencyTypeView:
      type: object
      properties:
        id: { $ref: '#/components/schemas/PendencyType' }
        name: { type: string }
        flowId: { type: string }
        pinnedVersion: { type: integer, nullable: true, description: null = follows the latest }
        effectiveVersion: { type: integer, description: Version new pendencies start on }
    FlowDefinition:
      type: object
      required: [initial, states]
      properties:
        initial: { type: string }
        states:
          type: object
          additionalProperties:
            type: object
            required: [label]
            properties:
              label: { type: string }
              final: { type: boolean }
              position:
                type: object
                properties: { x: { type: number }, y: { type: number } }
              transitions:
                type: array
                description: >-
                  Ways out of the state, in priority order. When an action happens, the first
                  transition that lists it and whose roles and guards pass wins.
                items:
                  type: object
                  required: [actions, to, roles]
                  properties:
                    actions:
                      type: array
                      minItems: 1
                      description: Any of these actions takes the transition.
                      items: { type: string, enum: [ATTACH_DOCUMENT, RESOLVE_WITH_COMMENT, REQUEST_EXCEPTION, APPROVE, REJECT] }
                    to: { type: string }
                    roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
                    guards: { type: array, items: { type: string, example: payment-due-within-48h } }
                    notify: { type: array, items: { $ref: '#/components/schemas/Role' } }
    FlowVersion:
      type: object
      properties:
        version: { type: integer }
        definition: { $ref: '#/components/schemas/FlowDefinition' }
        publishedAt: { type: string, format: date-time }
        publishedBy: { type: string }
    Flow:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        draft:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/FlowDefinition' }]
          description: Work in progress. Null when there is nothing unpublished.
        versions: { type: array, items: { $ref: '#/components/schemas/FlowVersion' } }
        revision: { type: integer, description: Optimistic-locking counter }
    FlowSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        latestVersion: { type: integer }
        hasDraft: { type: boolean }
        versions:
          type: array
          items:
            type: object
            properties:
              version: { type: integer }
              publishedAt: { type: string, format: date-time }
              publishedBy: { type: string }
    FlowIssue:
      type: object
      properties:
        message: { type: string }
        state: { type: string }
        action: { type: string }
    FlowCatalog:
      type: object
      properties:
        actions:
          type: array
          items:
            type: object
            properties: { id: { $ref: '#/components/schemas/Action' }, label: { type: string }, payload: { type: string } }
        guards:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              description: { type: string }
              requiresFacts: { type: array, items: { type: string } }
        roles:
          type: array
          items:
            type: object
            properties: { id: { $ref: '#/components/schemas/Role' }, label: { type: string } }
        effects:
          type: array
          items:
            type: object
            properties: { id: { type: string }, label: { type: string } }
    Action:
      type: string
      enum: [ATTACH_DOCUMENT, RESOLVE_WITH_COMMENT, REQUEST_EXCEPTION, APPROVE, REJECT]
    HistoryEntry:
      type: object
      required: [at, actorId, action, from, to]
      properties:
        at: { type: string, format: date-time }
        actorId: { type: string }
        action:
          type: string
          enum: [OPEN, ATTACH_DOCUMENT, RESOLVE_WITH_COMMENT, REQUEST_EXCEPTION, APPROVE, REJECT]
        from:
          type: string
          nullable: true
          description: Previous status (null for OPEN)
        to: { $ref: '#/components/schemas/Status' }
        detail: { type: string }
    Pendency:
      type: object
      required: [id, eventId, type, flow, flowVersion, title, status, statusLabel, resolved, documents, history, version]
      properties:
        id: { type: string, example: PEND-1 }
        eventId: { type: string, example: EVT-1 }
        type: { $ref: '#/components/schemas/PendencyType' }
        flow: { $ref: '#/components/schemas/PendencyFlow' }
        flowVersion:
          type: integer
          description: Flow version it was opened on. Fixed for the pendency's whole life.
        title: { type: string }
        paymentDueAt:
          type: string
          format: date-time
          description: Only when its flow version has a guard on the due date.
        status: { $ref: '#/components/schemas/Status' }
        statusLabel: { type: string, description: Label of the status in its flow version }
        resolved: { type: boolean, description: Reached a final state }
        documents:
          type: array
          items: { type: string }
        resolutionComment: { type: string }
        exceptionJustification: { type: string }
        rejectionReason:
          type: string
          description: Why it came back to the branch. Cleared when the branch acts again.
        history:
          type: array
          items: { $ref: '#/components/schemas/HistoryEntry' }
        version:
          type: integer
          description: Optimistic-locking counter
    ReleaseStatus:
      type: string
      enum: [not_scheduled, in_analysis, scheduled]
    ReleaseAction:
      type: string
      enum: [START_ANALYSIS, RETURN, SCHEDULE]
    Event:
      type: object
      required: [id, type, name, releaseStatus, pendencies, completed, history, version]
      properties:
        id: { type: string, example: EVT-1 }
        type: { $ref: '#/components/schemas/EventType' }
        name: { type: string }
        paymentDueAt:
          type: string
          format: date-time
          description: Only when set at creation. Followed by every payment pendency of the event.
        releaseStatus: { $ref: '#/components/schemas/ReleaseStatus' }
        pendencies:
          type: object
          description: Derived from the event's pendencies on every read
          required: [status, total, resolved]
          properties:
            status:
              type: string
              enum: [ok, pending]
              description: ok when every pendency is resolved
            total: { type: integer }
            resolved: { type: integer }
        completed:
          type: boolean
          description: true when releaseStatus is scheduled AND pendencies.status is ok
        history:
          type: array
          items:
            type: object
            required: [at, actorId, action, from, to]
            properties:
              at: { type: string, format: date-time }
              actorId: { type: string }
              action:
                type: string
                enum: [OPEN, START_ANALYSIS, RETURN, SCHEDULE]
              from:
                type: string
                nullable: true
              to: { $ref: '#/components/schemas/ReleaseStatus' }
              detail: { type: string }
        version: { type: integer }
    Notification:
      type: object
      required: [at, pendencyId, role, message]
      properties:
        at: { type: string, format: date-time }
        pendencyId: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        message: { type: string }
    Error:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message: { type: string }
        field: { type: string }
        allowed:
          type: array
          items: { type: string }
        reason:
          type: object
          description: Typed error returned by machine-flow
          properties:
            code:
              type: string
              enum: [UNKNOWN_STATE, FINAL_STATE, INVALID_EVENT, FORBIDDEN, GUARD_FAILED]
            state: { type: string }
            event: { type: string }
            failed:
              type: array
              items: { type: string }
